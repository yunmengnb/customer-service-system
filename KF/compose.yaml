# 忆梦云团队开发
name: yimeng-kf
services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
  server:
    build: ./server
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/customer_service
      REDIS_URL: redis://redis:6379
    ports:
      - "${API_PORT}:3000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  admin-web:
    build: ./admin-web
    restart: unless-stopped
    ports: ["${ADMIN_PORT}:80"]
    depends_on: { server: { condition: service_healthy } }
  user-web:
    build: ./user-web
    restart: unless-stopped
    ports: ["${USER_PORT}:80"]
    depends_on: { server: { condition: service_healthy } }
  client-web:
    build: ./client-web
    restart: unless-stopped
    ports: ["${CLIENT_PORT}:80"]
    depends_on: { server: { condition: service_healthy } }
volumes:
  mongo_data:
  redis_data:
  uploads_data:
