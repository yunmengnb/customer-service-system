// 忆梦云团队开发
plugins {
    id 'com.android.application'
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

def releaseKeystore = rootProject.file('signing/customer-release.jks')
def releaseStorePassword = providers.gradleProperty('CUSTOMER_RELEASE_STORE_PASSWORD')
        .orElse(providers.environmentVariable('CUSTOMER_RELEASE_STORE_PASSWORD'))
        .orNull
def releaseKeyAlias = providers.gradleProperty('CUSTOMER_RELEASE_KEY_ALIAS')
        .orElse(providers.environmentVariable('CUSTOMER_RELEASE_KEY_ALIAS'))
        .orNull
def releaseKeyPassword = providers.gradleProperty('CUSTOMER_RELEASE_KEY_PASSWORD')
        .orElse(providers.environmentVariable('CUSTOMER_RELEASE_KEY_PASSWORD'))
        .orNull
def releaseBuildRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase(Locale.ROOT).contains('release')
}
def releaseSigningReady = releaseKeystore.isFile() && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

if (releaseBuildRequested && !releaseSigningReady) {
    throw new GradleException(
            'Release 签名配置不完整。请通过环境变量或用户级 ~/.gradle/gradle.properties 设置 ' +
                    'CUSTOMER_RELEASE_STORE_PASSWORD、CUSTOMER_RELEASE_KEY_ALIAS、CUSTOMER_RELEASE_KEY_PASSWORD。'
    )
}

android {
    namespace 'com.yimeng.customer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.yimeng.customer'
        minSdk 24
        targetSdk 35
        versionCode 8
        versionName '1.1.6'
    }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile releaseKeystore
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation('io.socket:socket.io-client:2.1.1') {
        exclude group: 'org.json', module: 'json'
    }
}
